<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}} — RJ</title>
<meta name="description" content="{{SUMMARY}}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="../theme.css?v={{ASSET_V}}" />
<link rel="stylesheet" href="style.css?v={{ASSET_V}}" />
<script src="../theme.js?v={{ASSET_V}}"></script>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>

<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="../index.html" title="Home">rajesh<span class="dim">@</span>rc<span class="dim"> ~ writing</span></a>
    <div class="top-actions">
      <nav class="links">
        <a href="../index.html" title="Who am I">who am i</a>
        <a href="index.html" title="Read my writing">writing</a>
        <a href="../resume.html" title="My résumé">résumé</a>
        <a href="../index.html#contact" title="Get in touch">contact</a>
      </nav>
      <button class="theme-toggle" type="button" title="Switch theme" aria-label="Switch theme">
        <svg class="tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="tt-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span class="tt-label">light</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <article class="post">
    <a class="back" href="index.html" title="All writing">← all writing</a>
    <header class="post-head">
      <div class="post-meta">{{DATE}}</div>
      <h1 class="post-title">{{TITLE}}</h1>
      <p class="post-summary">{{SUMMARY}}</p>
    </header>
    {{IMAGE}}
    <div class="post-body">
      {{BODY}}
    </div>
    {{POST_NAV}}
  </article>
</main>

<footer class="foot">
  <div class="wrap foot-base">
    <span>© <span class="year">2026</span> RJ</span>
    <span><a href="../index.html" title="Back to home">← back to home</a></span>
  </div>
</footer>
<script>
  document.querySelectorAll('.year').forEach(function (e) { e.textContent = new Date().getFullYear(); });
</script>
</body>
</html>
